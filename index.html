 idle=0});

 const ex=homes.filter(h=>norm(h.n)===q),list=ex.length?ex:homes.filter(h=>norm(h.n).includes(q));
 if(!list.length){hlOff();$('tip').textContent='❌ «'+raw+'» tabılmadı';return}
 lastI=(q===lastQ)?(lastI+1)%list.length:0;lastQ=q;
 const h=list[lastI],hm=meshes.find(o=>o.userData.h===h);

 $('tip').textContent='✅ '+h.n+' tabıldı: 🏠 sarı sheńber, 🚶 qızıl jebe'+(list.length>1?' ('+(lastI+1)+'/'+list.length+')':'')}

 if(hlO){hlRing.visible=true;hlRing.position.set(hlO.g.position.x,.5,hlO.g.position.z);hlRing.scale.setScalar(1+.12*Math.sin(now/200));if(hlO.s)hlO.s.visible=true}
